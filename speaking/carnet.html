<style>

:root{
  --bg:#f3f5f8; --paper:#ffffff; --ink:#18223a; --muted:#5d6780; --line:#dde2ea;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151f; --paper:#181e2b; --ink:#e6eaf3; --muted:#9aa3b8; --line:#2a3245;
  --accent:#8fa9f0; --accent-soft:#232e4a; --warn:#f08a80; --warn-soft:#3a2224; --done:#7fcfa2; --done-soft:#1d3328; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151f; --paper:#181e2b; --ink:#e6eaf3; --muted:#9aa3b8; --line:#2a3245;
  --accent:#8fa9f0; --accent-soft:#232e4a; --warn:#f08a80; --warn-soft:#3a2224; --done:#7fcfa2; --done-soft:#1d3328; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--fr);font-weight:600;font-size:2rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.stats{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.9rem;color:var(--muted)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{display:flex;flex-direction:column;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row .lab{font-size:.75rem;letter-spacing:.06em;color:var(--muted);min-width:44px}

.list{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:10px}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:4px 12px;padding:14px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.num{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:4px}
.body{min-width:0;display:flex;flex-direction:column;gap:4px}
.fr{font-family:var(--fr);font-size:1.15rem;font-weight:600;line-height:1.35}
.ko{color:var(--muted)}
.ex{font-size:.92rem;border-left:2px solid var(--line);padding-left:10px;margin-top:2px}
.ex .exfr{font-family:var(--fr);font-style:italic}

.note{font-size:.8rem;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:2px 8px;align-self:flex-start}
.next{font-size:.75rem;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 8px;align-self:flex-start}
.side{display:flex;flex-direction:column;gap:6px;align-items:flex-end}

.empty{padding:24px;text-align:center;color:var(--muted)}
.foot{font-size:.8rem;color:var(--muted)}
@media (max-width:480px){.item{grid-template-columns:1fr auto}.num{grid-column:1/-1;padding:0}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Carnet d'oral</h1>
    <p class="sub">ChatGPT 말하기 수업에서 배운 표현 90개. Session 1~27에서 E01~E81을 배웠고, E82~E90은 Session 28~30에서 배운다.</p>
  </header>
  <div class="stats" id="stats"></div>
  <div class="bar">
    <div class="row"><span class="lab">묶음</span><span id="groups" class="row"></span></div>
    <div class="row"><span class="lab">보기</span>
      <button class="chip" id="m-all" aria-pressed="true">한눈에</button>
      <button class="chip" id="m-recall" aria-pressed="false">떠올리기</button>
    </div>
    <div class="row"><span class="lab">고르기</span>
      <button class="chip" id="f-weak" aria-pressed="false">다시 볼 것만</button>
      <button class="chip" id="f-hide" aria-pressed="false">익힘 숨기기</button>
      <button id="shuffle">섞기</button>
      <button id="reset">순서대로</button>
    </div>
  </div>
  <div class="list" id="list"></div>
  <p class="foot">떠올리기: 한국어를 보고 프랑스어를 소리 내어 말한 뒤 눌러서 확인한다. 「익힘」 표시는 이 브라우저에만 남는다. 🔊는 기기에 프랑스어 음성이 있을 때만 나온다. 「다시 볼 것」은 지난 수업 기록(FR-PROGRESS 오류 칸, 진도표)에서 골랐다.</p>
</div>

["E","J'ai hâte de …","빨리 …하고 싶어.","J'ai hâte de partir en vacances.","빨리 휴가 가고 싶어."],
["E","Je suis crevé.","완전 지쳤어.","J'ai travaillé jusqu'à minuit. Je suis crevé.","자정까지 일했어. 완전 지쳤어."],
["E","J'ai du mal à …","…하는 게 잘 안 돼.","J'ai du mal à dormir en ce moment.","요즘 잠이 잘 안 와."],
["E","Je n'ai pas eu le temps de …","…할 시간이 없었어.","Je n'ai pas eu le temps de manger.","밥 먹을 시간이 없었어."],
["E","Tant mieux.","잘됐다.","J'ai retrouvé mon portable ! — Tant mieux.","폰 찾았어! — 잘됐다."],
["E","Tant pis.","할 수 없지.","Le magasin est fermé. — Tant pis.","가게 닫았네. — 할 수 없지."],
["E","Ça arrive.","그럴 수도 있지.","J'ai oublié ton anniversaire… — Ça arrive.","네 생일 깜빡했어… — 그럴 수도 있지."],
["E","Il vaut mieux + 동사원형","…하는 게 낫겠어.","Il vaut mieux se reposer ce soir.","오늘 밤엔 쉬는 게 낫겠어."],
["E","Tu devrais …","너 …하는 게 좋겠어.","Tu devrais voir un médecin.","너 병원 가 보는 게 좋겠어."],
["E","À ta place, je …","내가 너라면 …할 거야.","À ta place, je dormirais plus.","내가 너라면 더 잘 거야."],
["E","J'aimerais bien …","…하고 싶어.","J'aimerais bien apprendre le piano.","피아노 배워 보고 싶어."],
["E","Je compte …","…할 생각이야.","Je compte partir en Bretagne cet été.","이번 여름에 브르타뉴에 갈 생각이야."],
["E","On verra.","그때 가서 보자.","Tu viens demain ? — On verra.","내일 와? — 그때 가서 보자."],
["E","Ça fait longtemps !","오랜만이야!","Salut Marc ! Ça fait longtemps !","안녕 마르크! 오랜만이야!"],
["E","Je m'en occupe.","내가 할게, 내가 맡을게.","Les billets ? Je m'en occupe.","표? 내가 할게."],
["E","Ça me fait plaisir.","기뻐, 나도 좋아.","Merci pour le cadeau, ça me fait plaisir.","선물 고마워, 기쁘다."]
];
const LEARNED=81;
const items=D.map((d,i)=>({id:"E"+String(i+1).padStart(2,"0"),n:i+1,g:d[0],fr:d[1],ko:d[2],exfr:d[3],exko:d[4],note:d[5]||"",next:i+1>LEARNED}));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let done=new Set(store.get("carnet-done",[]));
const st={g:"all",recall:store.get("carnet-recall",false),weak:false,hide:false,order:null,shown:new Set()};
let frVoice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();frVoice=vs.find(v=>/^fr(-|_)FR/i.test(v.lang))||vs.find(v=>/^fr/i.test(v.lang))||null;render()}catch(e){}}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/…/g,"").replace(/\+ 동사원형/,""));u.lang="fr-FR";if(frVoice)u.voice=frVoice;u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function chips(){
  const opts=[["all","전체"],...Object.entries(G).map(([k,v])=>[k,k+" "+v])];
  $("#groups").innerHTML=opts.map(([k,v])=>`<button class="chip" data-g="${k}" aria-pressed="${st.g===k}">${v}</button>`).join("");
}
function render(){
  chips();
  $("#m-all").setAttribute("aria-pressed",!st.recall);$("#m-recall").setAttribute("aria-pressed",st.recall);
  $("#f-weak").setAttribute("aria-pressed",st.weak);$("#f-hide").setAttribute("aria-pressed",st.hide);
  const weakN=items.filter(x=>x.note).length;
  $("#stats").innerHTML=`<span>배운 표현 <b>${LEARNED}</b></span><span>앞으로 <b>${items.length-LEARNED}</b></span><span>다시 볼 것 <b>${weakN}</b></span><span>익힘 표시 <b>${done.size}</b> / ${items.length}</span>`;
  let list=st.order?st.order.map(i=>items[i]):items.slice();
  list=list.filter(x=>(st.g==="all"||x.g===st.g)&&(!st.weak||x.note)&&(!st.hide||!done.has(x.id)));
  if(!list.length){$("#list").innerHTML=`<div class="empty">조건에 맞는 표현이 없다. 고르기를 풀어 보세요.</div>`;return}
  $("#list").innerHTML=list.map(x=>{
    const open=!st.recall||st.shown.has(x.id);
    const speak=frVoice?`<button data-say="${x.id}" aria-label="${x.id} 듣기">🔊</button>`:"";
    return `<div class="item"><div class="num">${x.id}</div><div class="body">
      ${open?`<div class="fr" lang="fr">${esc(x.fr)}</div>`:""}
      <div class="ko">${esc(x.ko)}</div>
      ${!open?`<button class="hidden-fr" data-show="${x.id}">프랑스어 보기</button>`:""}
      <div class="ex">${open?`<div class="exfr" lang="fr">${esc(x.exfr)}</div>`:""}<div class="exko">${esc(x.exko)}</div></div>
      ${x.note?`<span class="note">${esc(x.note)}</span>`:""}
      ${x.next?`<span class="next">Session ${Math.ceil(x.n/3)}에서 배울 표현</span>`:""}
    </div><div class="side">${open?speak:""}<button class="ok" data-ok="${x.id}" aria-pressed="${done.has(x.id)}">${done.has(x.id)?"익힘 ✓":"익힘"}</button></div></div>`}).join("");
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.g){st.g=b.dataset.g}
  else if(b.id==="m-all"){st.recall=false;store.set("carnet-recall",false)}
  else if(b.id==="m-recall"){st.recall=true;st.shown.clear();store.set("carnet-recall",true)}
  else if(b.id==="f-weak"){st.weak=!st.weak}
  else if(b.id==="f-hide"){st.hide=!st.hide}
  else if(b.id==="shuffle"){const a=items.map((_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}st.order=a;st.shown.clear()}
  else if(b.id==="reset"){st.order=null}
  else if(b.dataset.show){st.shown.add(b.dataset.show);const x=items.find(i=>i.id===b.dataset.show);render();say(x.fr);return}
  else if(b.dataset.say){const x=items.find(i=>i.id===b.dataset.say);say(x.fr+". "+x.exfr);return}
  else if(b.dataset.ok){const id=b.dataset.ok;done.has(id)?done.delete(id):done.add(id);store.set("carnet-done",[...done])}
  else return;
  render();
});
render();
</script>
</body>
