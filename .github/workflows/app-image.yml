name: App image

# app/ (옛 FTF) 의 Docker 이미지 두 개(앱·도구)를 빌드해 GHCR 에 올리고 서버에 배포한다.
#   ghcr.io/ybbarng/study-fr        — 앱 (app/Dockerfile 의 runner)
#   ghcr.io/ybbarng/study-fr-tools  — progress.db 마이그레이션·스크립트 (app/Dockerfile 의 tools)
# 태그: 커밋 sha 는 항상, main 이면 latest 도.
# 학습 기록 커밋은 배포를 부르지 않는다: app/ 아래(문서·md 제외)나 이 파일이 바뀔 때만 돈다.
# 2026-11-23 FTF 저장소의 .github/workflows/image.yml 을 옮겨 왔다.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "!app/docs/**"
      - "!app/**/*.md"
      - ".github/workflows/app-image.yml"
  workflow_dispatch:

concurrency:
  group: app-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - target: runner
            image: ghcr.io/ybbarng/study-fr
          - target: tools
            image: ghcr.io/ybbarng/study-fr-tools
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: app
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 두 타깃이 deps·build 단계를 같이 쓰므로 캐시를 나눠 갖는다
          cache-from: type=gha,scope=study-fr
          cache-to: type=gha,scope=study-fr,mode=max

  # 서버에 배포한다. 서버의 배포 키는 forced-command 로 servers 저장소의 deploy.sh 만 실행한다.
  # 이미지를 받을 토큰은 이 실행의 GITHUB_TOKEN 을 표준입력으로 넘긴다(서버에 남지 않고, 실행이 끝나면 만료된다).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: app-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH → deploy.sh
        env:
          KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          PORT: ${{ secrets.SERVER_PORT || '22' }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ github.ref == 'refs/heads/main' && 'deploy' || 'test' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf '%s\n' "$TOKEN" | ssh -i ~/.ssh/deploy_key -p "$PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            "$USER@$HOST" "$MODE $GITHUB_SHA"
          rm -f ~/.ssh/deploy_key
